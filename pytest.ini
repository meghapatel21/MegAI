# MegAI test suite - offline by design: no GROQ_API_KEY or network needed.
[pytest]
testpaths = tests
# langsmith's pytest plugin auto-loads via entry points before any of our code
# runs, so app._compat's xxhash shim can't reach it in time on a machine that
# blocks xxhash's native extension (e.g. a Windows WDAC policy). This project
# does not use LangSmith's test-tracking integration, so disabling its plugin
# is free - it does not touch anything the test suite exercises.
addopts = -q -p no:langsmith_plugin
filterwarnings =
    ignore::DeprecationWarning
